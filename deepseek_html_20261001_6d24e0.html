<!DOCTYPE html>
<html lang="en">

  <style>
    :root {
      --color-white: #fff;
      --color-white-100: rgba(255, 255, 255, 0.1);
      --color-white-200: rgba(255, 255, 255, 0.2);
      --color-white-400: rgba(255, 255, 255, 0.4);
      --color-white-900: rgba(255, 255, 255, 0.9);
      --color-black: #1e1e1e;
      --color-black-100: rgba(0, 0, 0, 0.1);
      --color-black-500: rgba(0, 0, 0, 0.5);
      --color-blue-800: #007ff7;
      --app-color-white: rgb(252, 255, 251);
      --color-red: rgba(255, 2, 2, 0.788);
      --color-green: #11dd4e;
    }

    * { margin: 0; padding: 0; outline: 0; border: 0; list-style: none; box-sizing: border-box; }

    body {
      height: 100vh;
      user-select: none;
      font-family: "Lexend", sans-serif;
      background-color: #0f172a;
      background-image: none;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow: hidden;
      cursor: default;
    }
    /* macOS-style cursors */
    a, button, .icon, .leftLi, .steam-tab, .steam-nav button,
    .lib-game, .game-tile, .featured-card, .cta, .cta-sm,
    .steam-footer-bar span, .open_Search, .battery, .clock,
    .child-launchpad, input[type="search"] {
      cursor: pointer;
    }
    input, textarea, [contenteditable="true"] {
      cursor: text;
    }
    .window, .steam, .calculator {
      cursor: default;
    }
    .window__taskbar, .steam .window__taskbar {
      cursor: default;
    }
    .ui-draggable-dragging {
      cursor: grabbing !important;
    }

    /* loading replaced by .splash-screen */

    /* ===== NAVBAR ===== */
    .navbar {
      width: 100%;
      height: 28px;
      padding: 0 12px 0 10px;
      position: fixed;
      top: 0; left: 0;
      color: #f5f5f7;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(48px) saturate(220%);
      -webkit-backdrop-filter: blur(48px) saturate(220%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      box-shadow: 0 1px 0 rgba(255,255,255,0.16) inset;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .navbar > ul {
      display: flex;
      align-items: center;
      height: 100%;
      gap: 0;
      margin: 0;
      padding: 0;
    }
    .navbar li {
      position: relative;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin: 0;
      cursor: default;
      text-shadow: none;
      color: #f5f5f7;
      height: 100%;
      display: flex;
      align-items: center;
    }
    .navbar .leftLi {
      padding: 0 11px;
      height: 100%;
      display: flex;
      align-items: center;
      border-radius: 0;
    }
    .navbar .leftLi:hover {
      background-color: rgba(255,255,255,0.12);
      border-radius: 0;
    }
    .navbar .leftLi.logo {
      padding: 0 10px;
    }
    .navbar .leftLi.logo img {
      height: 14px;
      width: auto;
      display: block;
      opacity: 0.95;
    }
    /* Active app name — bold like real macOS */
    li.app_name {
      display: none;
      font-weight: 700 !important;
      font-size: 13px !important;
      letter-spacing: -0.02em;
    }
    li.app_name[style*="block"],
    li.app_name[style*="flex"],
    li.app_name.is-active {
      display: flex !important;
    }

    li > ul {
      display: none; position: absolute; left: 0; top: 100%; margin-top: 1px;
      padding: 4px; min-width: 200px; background: var(--color-white-400);
      backdrop-filter: blur(11px); border-radius: 5px; box-shadow: 0 2px 7px rgba(0,0,0,0.36);
      flex-direction: column;
    }
    li:hover > ul { display: flex; }
    li > ul > li { width: 100%; border-bottom: 1px solid rgba(0,0,0,0.15); padding-bottom: 5px; margin-bottom: 5px; }
    li > ul > li:last-child { border: none; margin: 0; padding: 0; }
    li > ul > li > button {
      color: white; width: 100%; text-align: left; font-family: "Lexend"; font-weight: 100;
      padding: 4px 8px; border-radius: 5px; font-size: 14px; cursor: pointer;
    }
    li > ul > li > button:hover { background: var(--color-blue-800); }

    .navbar__right li { margin: 0 10px; }
    .navbar__right .battery {
      display: flex; align-items: center; padding: 0.3rem 0.5rem; border-radius: 4px; cursor: pointer;
    }
    .navbar__right .battery.selected { background: rgba(255,255,255,0.18); }
    .navbar__right .battery__container {
      width: 22px; height: 10px; padding: 1px; position: relative; border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.4);
    }
    .navbar__right .battery__container::after {
      content: ""; background: rgba(255,255,255,0.4); width: 3px; height: 7px;
      position: absolute; top: 50%; right: -5px; transform: translateY(-50%);
      border-top-right-radius: 3px; border-bottom-right-radius: 3px;
    }
    .navbar__right .battery__progress { height: 100%; background: white; border-radius: 2px; }
    .navbar__right .battery__text { font-size: 12px; margin-right: 4px; }
    .navbar__right .battery__popup {
      position: absolute; top: calc(100% + 6px); right: 0; opacity: 0; width: 220px;
      transition: 0.2s; padding: 4px; background: rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(60px); border-radius: 8px;
    }
    .navbar__right .battery__popup.opened { opacity: 1; }
    .navbar__right .battery__popup header { display: flex; justify-content: space-between; padding: 0 10px; }
    .navbar__right .battery__popup header h3 { font-size: 16px; }
    .navbar__right .battery__popup header span { opacity: 0.75; font-size: 12px; }
    .navbar__right .battery__popup p { font-size: 11px; margin-top: 4px; padding: 0 10px; }
    .navbar__right .battery__popup hr { margin: 6px 8px; border-top: 1px solid rgba(255,255,255,0.2); }
    .navbar__right .battery__popup button {
      padding: 4px 10px; color: white; width: 100%; text-align: left; border-radius: 4px; cursor: pointer;
    }
    .navbar__right .battery__popup button:hover { background: var(--color-blue-800); }


    .navbar__right {
      display: flex;
      align-items: center;
      height: 100%;
      gap: 2px;
    }
    .navbar__right li {
      margin: 0 !important;
      padding: 0 8px;
      height: 100%;
      display: flex;
      align-items: center;
    }
    .navbar__right li:hover {
      background: rgba(255,255,255,0.12);
    }
    .navbar__right .clock,
    .navbar__right .battery__text {
      font-size: 13px;
      font-weight: 400;
      color: #f5f5f7;
      letter-spacing: -0.01em;
    }
    .navbar li > ul {
      top: 100%;
      margin-top: 0;
      padding: 5px;
      min-width: 220px;
      background: rgba(40, 40, 42, 0.88) !important;
      backdrop-filter: blur(40px) saturate(200%) !important;
      -webkit-backdrop-filter: blur(40px) saturate(200%) !important;
      border: 1px solid rgba(255,255,255,0.12) !important;
      border-radius: 8px !important;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4) !important;
    }
    .navbar li > ul > li {
      border: none !important;
      margin: 0 !important;
      padding: 0 !important;
      height: auto;
      display: block;
    }
    .navbar li > ul > li > button {
      color: #f5f5f7 !important;
      font-size: 13px;
      font-weight: 400;
      padding: 5px 10px;
      border-radius: 5px;
      font-family: inherit;
    }
    .navbar li > ul > li > button:hover {
      background: #0a84ff !important;
      color: #fff !important;
    }
    .navbar .leftLi.app_name p {
      margin: 0;
      font-weight: 700;
      font-size: 13px;
    }

    /* Menu bar dropdowns — click + hover like macOS */
    .navbar {
      overflow: visible !important;
    }
    .navbar__left {
      overflow: visible !important;
    }
    .navbar .leftLi.menu-item,
    .navbar .leftLi.logo {
      position: relative;
    }
    .navbar .leftLi > ul {
      display: none;
      position: absolute;
      left: 0;
      top: 100%;
      margin: 0;
      padding: 6px;
      min-width: 220px;
      flex-direction: column;
      z-index: 10050;
      background: rgba(40, 40, 42, 0.92) !important;
      backdrop-filter: blur(40px) saturate(200%) !important;
      -webkit-backdrop-filter: blur(40px) saturate(200%) !important;
      border: 1px solid rgba(255,255,255,0.14) !important;
      border-radius: 8px !important;
      box-shadow: 0 16px 48px rgba(0,0,0,0.45) !important;
    }
    .navbar .leftLi.open > ul,
    .navbar .leftLi:hover > ul {
      display: flex;
    }
    /* Once one menu is open, hovering other items switches (macOS behavior) */
    .navbar.menus-open .leftLi:hover > ul {
      display: flex;
    }
    .navbar .leftLi > ul > li {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
    }
    .navbar .leftLi > ul > li.menu-sep {
      height: 1px;
      margin: 5px 8px !important;
      background: rgba(255,255,255,0.12);
      pointer-events: none;
    }
    .navbar .leftLi > ul > li > button {
      width: 100%;
      text-align: left;
      color: #f5f5f7 !important;
      font-size: 13px;
      font-weight: 400;
      padding: 6px 12px;
      border-radius: 5px;
      background: transparent;
      border: none;
      font-family: inherit;
      cursor: pointer;
    }
    .navbar .leftLi > ul > li > button:hover {
      background: #0a84ff !important;
      color: #fff !important;
    }
    #menu-app-name {
      display: flex !important;
      font-weight: 700 !important;
    }
    #menu-app-name p {
      margin: 0;
      font-weight: 700;
      font-size: 13px;
    }


    /* ===== DOCK (PuruVJ/macos-web Dock.svelte + DockItem.svelte) ===== */
    .dock-container {
      position: fixed;
      left: 0; bottom: 0;
      width: 100%;
      height: 5.2rem;
      padding: 0.4rem;
      padding-bottom: 0.7rem;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none;
      z-index: 100;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    .dock-el, .dock-el.dock, #macos-dock {
      position: relative;
      height: 100%;
      display: flex;
      align-items: flex-end;
      padding: 0.3rem;
      border-radius: 1.2rem;
      background-color: hsla(240, 24%, 100%, 0.18);
      box-shadow:
        inset 0 0 0 0.2px hsla(0, 0%, 96%, 0.7),
        0 0 0 0.2px hsla(240, 3%, 11%, 0.55),
        hsla(0, 0%, 0%, 0.3) 2px 5px 19px 7px;
      pointer-events: auto;
      width: max-content;
      max-width: calc(100vw - 16px);
      margin: 0 auto;
      left: auto; right: auto; bottom: auto;
      transform: none;
      border: none;
      gap: 0;
      overflow: visible;
    }
    .dock-el::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 1.2rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: -1;
      pointer-events: none;
    }
    .dock-el .divider {
      height: 100%;
      width: 0.2px;
      background-color: hsla(240, 3%, 11%, 0.3);
      margin: 0 4px;
      flex-shrink: 0;
      align-self: stretch;
    }
    .dock-el .dock-open-app-button {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      border-radius: 0.5rem;
      cursor: default;
      outline: none;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    .dock-el .dock-open-app-button > span.dock-icon-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 0;
    }
    .dock-el .dock-open-app-button img {
      /* width driven only by JS — matches macos-web style:width in rem */
      width: 3.6rem;
      height: auto;
      aspect-ratio: 1;
      display: block;
      border-radius: 22%;
      will-change: width;
      pointer-events: none;
      -webkit-user-drag: none;
      margin: 0;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
      transition: none !important;
      transform: none !important;
    }
    .dock-el .dock-open-app-button .tooltip {
      white-space: nowrap;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background-color: hsla(240, 24%, 100%, 0.5);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      box-shadow: hsla(0deg, 0%, 0%, 30%) 0px 1px 5px 2px;
      color: hsl(0, 0%, 11%);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 0.9rem;
      letter-spacing: 0.4px;
      display: none;
      pointer-events: none;
      z-index: 5;
    }
    .dock-el .dock-open-app-button:hover .tooltip { display: block; }
    .dock-el.dock-dragging .tooltip { display: none !important; }
    .dock-el .dock-open-app-button.dock-dragging-item { opacity: 0.4; }
    .dock-el .dock-open-app-button .dot {
      height: 4px;
      width: 4px;
      margin: 0;
      border-radius: 50%;
      background-color: hsl(240, 3%, 11%);
      opacity: 0;
      flex-shrink: 0;
    }
    .dock-el .dock-open-app-button .dot.is-open { opacity: 1; }
    .dock-el .point { display: none !important; }
    @keyframes dock-bounce-up {
      0% { transform: translateY(0); }
      30% { transform: translateY(-40px); }
      50% { transform: translateY(0); }
      70% { transform: translateY(-12px); }
      100% { transform: translateY(0); }
    }
    .dock-el .dock-open-app-button.dock-bounce > span.dock-icon-wrap {
      animation: dock-bounce-up 0.4s ease-in-out;
    }

    /* ===== WINDOWS ===== */
    .container__Window {
      width: 100%; height: 90%; justify-content: space-around; align-items: center; display: none;
    }
    .window {
      display: none; min-width: 50%; max-width: 80%; height: 430px; overflow: hidden;
      border-radius: 12px; box-shadow: 0 20px 30px var(--color-black-500);
      border: 1px solid #ffffff34; z-index: 10; touch-action: none;
      position: absolute;
    }
    /* Proper maximize — fills desktop under menu bar */
    .window.is-maximized,
    .steam.is-maximized,
    .settings-window.is-maximized,
    .safari.is-maximized,
    .Vscode.is-maximized,
    .calculator.is-maximized,
    .imovie-window.is-maximized,
    .devhub-window.is-maximized,
    .game-app.is-maximized {
      position: fixed !important;
      top: 28px !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: calc(100vh - 28px) !important;
      min-width: 0 !important;
      max-width: none !important;
      min-height: 0 !important;
      max-height: none !important;
      border-radius: 0 !important;
      border-left: none !important;
      border-right: none !important;
      border-bottom: none !important;
      box-shadow: none !important;
      transform: none !important;
      z-index: 45 !important;
      margin: 0 !important;
    }
    .window.is-maximized .window__taskbar,
    .settings-window.is-maximized .window__taskbar,
    .safari.is-maximized .window__taskbar,
    .Vscode.is-maximized .window__taskbar {
      border-radius: 0;
    }
    /* Green button looks "maximized" when active */
    .window.is-maximized .full::after,
    .window.is-maximized .full-Vscode::after,
    .window.is-maximized .full-note::after,
    .window.is-maximized .full-map::after,
    .window.is-maximized .full-settings::after,
    .window.is-maximized .full-safari::after,
    .steam.is-maximized .full-steam::after {
      /* subtle visual: smaller square when maximized */
    }
    .steam.maximized {
      position: fixed !important;
      top: 28px !important;
      left: 0 !important;
      width: 100vw !important;
      height: calc(100vh - 28px) !important;
      min-width: 0 !important;
      max-width: none !important;
      border-radius: 0 !important;
      z-index: 45 !important;
    }
    .window__taskbar {
      height: 38px; display: flex; justify-content: space-between; padding: 0 14px;
      background-color: var(--app-color-white); align-items: center;
    }
    .window__taskbar--actions { display: flex; align-items: center; gap: 9px; padding: 2px 0; }
    .window__taskbar--actions button {
      width: 14px; height: 14px; min-width: 14px; min-height: 14px;
      border-radius: 50%; transition: 0.15s ease; border: none; padding: 0;
      cursor: pointer; position: relative; flex-shrink: 0;
      /* larger invisible hit target */
      box-shadow: 0 0 0 3px transparent;
    }
    .window__taskbar--actions button:hover { filter: brightness(1.08); transform: scale(1.08); }
    .window__taskbar--actions button:nth-child(1),
    .window__taskbar--actions button.close,
    .window__taskbar--actions button[class*="close"] { background: #ff5f56; }
    .window__taskbar--actions button:nth-child(2),
    .window__taskbar--actions button.backfull,
    .window__taskbar--actions button[class*="backfull"],
    .window__taskbar--actions button[class*="min-"] { background: #ffbd2e; }
    .window__taskbar--actions button:nth-child(3),
    .window__taskbar--actions button.full,
    .window__taskbar--actions button[class*="full-"] { background: #27c93f; }
    /* Taller title bar = easier to grab and move */
    .window__taskbar {
      min-height: 40px !important;
      height: 40px !important;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .window__taskbar:active { cursor: grabbing; }
    .safari-chrome-top {
      min-height: 44px !important;
      cursor: grab;
      user-select: none;
    }
    .safari-chrome-top:active { cursor: grabbing; }
    .calculator__top--taskabr {
      display: flex; align-items: center; gap: 9px; padding: 8px 10px;
      cursor: grab;
    }
    .calculator__top--taskabr button {
      width: 14px; height: 14px; border-radius: 50%; border: none; padding: 0; cursor: pointer;
    }
    .calculator__top--taskabr .close-cal { background: #ff5f56; }
    .calculator__top--taskabr .backfull-cal { background: #ffbd2e; }
    .calculator__top--taskabr .full-cal { background: #27c93f; }
    .safari-traffic button {
      width: 14px !important; height: 14px !important; min-width: 14px !important;
      border-radius: 50%; border: none; padding: 0;
    }
    .window__taskbar--content h2 { color: var(--color-black); font-weight: 600; font-size: 15px; }



    /* Steam isolation — don't lag the whole OS */
    .window.steam {
      contain: layout style paint !important;
      isolation: isolate;
      transform: translateZ(0);
      backface-visibility: hidden;
    }
    .window.steam .steam-content {
      contain: layout style;
      content-visibility: auto;
      will-change: auto;
    }
    .window.steam .lib-main,
    .window.steam .steam-store .steam-body,
    .window.steam .lib-games {
      content-visibility: auto;
      contain-intrinsic-size: 400px 300px;
    }
    /* Kill expensive blur on Steam chrome */
    .window.steam,
    .window.steam .window__taskbar,
    .window.steam .steam-nav,
    .window.steam .lib-sidebar,
    .window.steam .steam-footer-bar,
    .window.steam .steam-play-bar {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    .window.steam.is-dragging,
    .window.steam.ui-draggable-dragging {
      contain: strict;
      pointer-events: auto !important;
    }
    .window.steam.is-dragging .steam-content,
    .window.steam.ui-draggable-dragging .steam-content {
      visibility: hidden !important; /* hide interior while dragging = massive speedup */
      pointer-events: none !important;
    }
    .window.steam.is-dragging::after,
    .window.steam.ui-draggable-dragging::after {
      content: "Moving…";
      position: absolute;
      inset: 32px 0 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1b2838;
      color: #8f98a0;
      font-size: 14px;
      z-index: 5;
      pointer-events: none;
    }
    .game-tile img, .lib-game img, .featured-card img, .steam-detail-hero {
      content-visibility: auto;
    }

    /* Faster Steam window movement */
    .window.steam {
      will-change: left, top, transform;
      contain: layout style;
    }
    .window.steam.ui-draggable-dragging,
    .window.steam.is-dragging {
      transition: none !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35) !important;
    }
    .window.steam.ui-draggable-dragging .steam-content,
    .window.steam.is-dragging .steam-content,
    .window.steam.ui-draggable-dragging iframe,
    .window.steam.is-dragging iframe {
      pointer-events: none !important;
    }
    .window.steam.ui-draggable-dragging * {
      transition: none !important;
      animation: none !important;
    }
